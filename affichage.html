<!DOCTYPE html>
<html>
    <head>
        <link rel="stylesheet" href="style.css" />
        <meta charset="utf-8"/>
        <title>Séléction des affichages</title>
    </head>
    <body>
        <section id="style"></section>
            <label for="Afficheur">Gestion de l'effet d'apparition :</label>
                <select id="select-effetapparition" name="effetapparition">
                    <option value="FL">Neige</option>
                    <option value="FA">Immédiat</option>
                    <option value="FI">Bas vers le Haut</option>
                    <option value="FP">Random</option>
                </select>
            <label for="Afficheur">Gestion de l'Effet d'Affichage :</label>
            <select id="select-effetaffichage" name="effetaffichage">
                <option value="MA">Normal</option>
                <option value="MB">CLignotant</option>
                <option value="MC">Son 1</option>
                <option value="MD">Son 2</option>
            </select>
            <label for="Afficheur">Durée d'affichage :</label>
            <select id="select-dureeaffichage" name="dureeaffichage">
                <option value="WC">2s</option>
                <option value="WF">5s</option>
                <option value="WK">10s</option>
                <option value="WZ">25s</option>
            </select>
            <label for="Afficheur">Effet de disparition :</label>
            <select id="select-effetdisparition" name="effetdisparition">
                <option value="FA">Immédiat</option>
                <option value="FB">Xopen</option>
                <option value="FE">Gauche</option>
                <option value="FF">Droite</option>
            </select>
